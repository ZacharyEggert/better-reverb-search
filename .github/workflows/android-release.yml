name: Android Release

# Manual only: builds a signed AAB from apps/android and uploads it to Play Console.
# versionCode defaults to the run number so every build is monotonically versioned.

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track"
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      version_name:
        description: "versionName (defaults to 1.0)"
        required: false
      version_code:
        description: "versionCode (defaults to the run number)"
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Write keystore
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Bundle release
        run: ./gradlew --no-daemon bundleRelease
        env:
          VERSION_CODE: ${{ inputs.version_code || github.run_number + 100 }}
          VERSION_NAME: ${{ inputs.version_name }}

      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: llc.exnihilo.betterreverbsearch
          releaseFiles: apps/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: draft

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: apps/android/app/build/outputs/bundle/release/app-release.aab
